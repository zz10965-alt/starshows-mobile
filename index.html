function organizeBuckets(m){
  const show = parseMinute(m.time) || 1110;
  const buckets = { '到达场馆':[], '进场前':[], '演出现场':[], '散场':[] };
  m.moments.forEach(mm=>{
    const t = parseMinute(mm.time);
    if(t==null){ buckets['演出现场'].push(mm); return; }
    if(t >= show+45) buckets['散场'].push(mm);
    else if(t >= show-10) buckets['演出现场'].push(mm);
    else if(t >= show-70) buckets['进场前'].push(mm);
    else buckets['到达场馆'].push(mm);
  });
  Object.keys(buckets).forEach(k=> buckets[k].sort((a,b)=>(parseMinute(a.time)??9999)-(parseMinute(b.time)??9999)));
  return buckets;
}
function showOrganizeResult(buckets){
  const mod=el('div','overlay');

  box.innerHTML=`<h3>✨ 整理好了</h3><div class="msub">小星按拍摄时间和当天行程，先帮你分好了：</div><div class="morganize-result">${lines}</div><div class="msub" style="margin-top:14px">你可以随时移动或修改。</div><div class="modal-cta"><button class="btn-big" id="orgOk">好的</button></div>`;

}
function runOrganize(m, btn){
  btn.textContent = '✦ 整理中…'; btn.disabled = true;
  setTimeout(()=>{

    const order=['到达场馆','进场前','演出现场','散场'];
    m.moments = order.map(k=>buckets[k]).flat();
    saveState();

}
function formatDateText(iso){

  sec1.appendChild(mineRow('💬','我的群聊', joinedGroups().length+' 个', ()=>switchView('grouplist')));
  v.appendChild(sec1);
  const sec2 = el('div','mine-sec');
  sec2.appendChild(el('div','mine-sec-t','星迹'));
  sec2.appendChild(mineRow('🌌','我的星迹', albums.length+' 本相册 · '+diaries.length+' 篇日记', ()=>switchView('memory')));
  v.appendChild(sec2);
  const sec3 = el('div','mine-sec');
  sec3.appendChild(el('div','mine-sec-t','设置'));
  sec3.appendChild(mineRow('↻','重置演示数据', '', ()=>openResetModal()));
  v.appendChild(sec3);
  const foot = el('div','pf-foot',''); foot.style.cssText='text-align:center;margin:6px 0 20px';
  foot.innerHTML='星演 StarShow · 高保真交互原型<br>纯前端 mock 数据 · 无真实 API / LLM';
  v.appendChild(foot);
}

/* ================= 重置 Demo ================= */
function openResetModal(){
  const m=el('div','overlay');
  const box=el('div','modal');
  box.innerHTML=`<h3>↻ 重置 Demo</h3><div class="msub">将恢复星演 StarShow 默认演示数据，你刚才的操作会被清除。</div><div class="modal-cta"><button class="btn-big" id="rstYes">恢复默认 Demo</button><button class="btn-ghost" id="rstNo">取消</button></div>`;
  m.appendChild(box); mountRoot().appendChild(m);
  box.querySelector('#rstYes').onclick=()=>resetDemo();
  box.querySelector('#rstNo').onclick=()=>closeOverlay();
  m.onclick=e=>{ if(e.target===m) closeOverlay(); };
}
function resetDemo(){
  try { localStorage.removeItem(LS_KEY); } catch(e){}
  chatLog = [];
  communityMsgs = null;
  seedState();
  if(profile) state.prefLabel = profile.pref;
  state.view='home'; state.activeConcert=null; state.detailTab='seat'; state.planStage='prep'; state.editing=false; state.planNode=null; state.journeySel=null;
  state.memoryView='albums'; state.memoryTab='map'; state.memDetailId=null; state.memFilterArtist=null; state.albumId=null; state.diaryId=null; state.from='home'; state.scrollPos={};
  closeOverlay();
  renderBottomNav(); renderMain();
  toast('✨ 已恢复默认演示');
}

/* ================= 首次引导 ================= */
function showGuide(){
  const m=el('div','overlay');
  const box=el('div','modal');
  box.innerHTML=`<h3>🎯 怎么体验这个 Demo</h3><div class="msub">这是一个<strong>可点的高保真原型</strong>，数据已预填。跟着 5 步走一遍，约 1 分钟看懂它。</div>
    <div class="guide-steps">
      <div class="gs"><span class="gn">1</span><span>底部「<b>🏠 首页</b>」→ 看为你推荐的演出</span></div>
      <div class="gs"><span class="gn">2</span><span>点任意演出卡 → 试试「<b>💺 选座</b>」和「<b>🎟 开票</b>」</span></div>
      <div class="gs"><span class="gn">3</span><span>点「<b>🎒 计划</b>」→ 看四阶段观演计划</span></div>
      <div class="gs"><span class="gn">4</span><span>点「<b>✨ 小星</b>」→ 打字「换个便宜酒店」看它改计划</span></div>
      <div class="gs"><span class="gn">5</span><span>点「<b>🌌 星迹</b>」→ 看那些被留下的现场</span></div>
    </div>
    <div class="modal-cta"><button class="btn-big" id="guideGo">开始体验 ✨</button></div>`;
  m.appendChild(box); mountRoot().appendChild(m);
  const done=()=>{ closeOverlay(); try{ localStorage.setItem('starshows_guide','1'); }catch(e){} };
  box.querySelector('#guideGo').onclick=done;
  m.onclick=e=>{ if(e.target===m) done(); };
}

/* ================= 启动 ================= */
(function init(){
  applyDemoDates();          // 先按当天算出相对日期（供 loadState 迁移 / buildPlan 使用）
  const had = loadState();
  if(!had){ seedState(); }
  applyDemoDates();          // 对已加载/已种子数据再重算一次「演示」开票时间，覆盖跨天后的 stale 值
  saveState();
  if(profile) state.prefLabel = profile.pref;
  state.view = profileDone() ? 'home' : 'home';
  renderBottomNav();
  renderMain();
  const rb=$('#resetBtn'); if(rb) rb.onclick=openResetModal;
  const gb=$('#guideBtn'); if(gb) gb.onclick=showGuide;
  let seen=false; try{ seen=localStorage.getItem('starshows_guide')==='1'; }catch(e){}
  if(!seen) showGuide();
})();
</script>
</body>
