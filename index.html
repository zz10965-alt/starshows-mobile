<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>星演 StarShow · AI 观演搭子</title>
<style>
  :root {
    --pink: #ff6b9d;
    --violet: #8b5cf6;
    --violet-soft: #a06bff;
    --yellow: #ffc94d;
    --mint: #34c9a0;
    --sky: #5cb8ff;
    --coral: #ff8a5c;
    --ink: #2a2438;
    --ink-soft: #7a7188;
    --ink-faint: #b3aabf;
    --bg: #faf7fb;
    --surface: #ffffff;
    --surface-2: #f5f0f8;
    --surface-3: #efe8f5;
    --line: #efe9f3;
    --line-strong: #e4dced;
    --r-sm: 12px;
    --r-md: 16px;
    --r-lg: 20px;
    --r-xl: 24px;
    --shadow-sm: 0 1px 3px rgba(122,95,160,.06), 0 1px 2px rgba(122,95,160,.04);
    --shadow: 0 8px 24px rgba(122,95,160,.10);
    --shadow-lg: 0 18px 44px rgba(122,95,160,.16);
    --grad: linear-gradient(135deg, var(--pink), var(--violet));
    --grad-soft: linear-gradient(135deg, #fff0f5, #f0edff);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    color: var(--ink);
    background: linear-gradient(135deg, #fff4f6 0%, #fff8e8 45%, #eef4ff 100%);
    -webkit-font-smoothing: antialiased;
  }

  /* ============ Desktop · Portfolio Preview ============ */
  .stage { min-height: 100%; display: flex; align-items: center; justify-content: center; gap: 56px; padding: 40px 32px; flex-wrap: wrap; }
  .brand-panel { max-width: 380px; display: flex; flex-direction: column; gap: 18px; }
  .brand-logo { width: 64px; height: 64px; border-radius: 20px; background: var(--grad); display: flex; align-items: center; justify-content: center; font-size: 32px; box-shadow: 0 12px 30px rgba(255,107,157,.35); }
  .brand-name { font-size: 40px; font-weight: 800; letter-spacing: .5px; line-height: 1.1; }
  .brand-name .hl { background: linear-gradient(90deg, var(--pink), var(--violet)); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
  .brand-slogan { font-size: 15px; color: var(--ink-soft); font-weight: 600; }
  .brand-desc { font-size: 13px; color: var(--ink-soft); line-height: 1.7; }
  .brand-note { font-size: 12px; color: var(--ink-faint); line-height: 1.6; }
  .brand-actions { display: flex; gap: 10px; flex-wrap: wrap; }
  .brand-btn { padding: 9px 16px; border-radius: 999px; border: 1.5px solid var(--line-strong); background: #fff; color: var(--ink-soft); font-size: 12.5px; font-weight: 700; cursor: pointer; transition: all .15s; }
  .brand-btn:hover { border-color: var(--violet); color: var(--violet); }

  /* ============ Phone viewport ============ */
  .phone {
    width: 400px; max-width: 100vw; height: min(840px, 92vh);
    background: var(--bg); border-radius: 44px;
    box-shadow: 0 30px 80px rgba(90,70,130,.22), 0 0 0 1px rgba(122,95,160,.08), 0 0 0 8px #fff, 0 0 0 9px rgba(122,95,160,.10);
    display: flex; flex-direction: column; overflow: hidden; position: relative; flex: none;
  }
  .statusbar { height: 46px; flex: none; display: flex; align-items: center; justify-content: space-between; padding: 0 26px; font-size: 13px; font-weight: 700; color: var(--ink); background: var(--bg); }
  .statusbar .sb-time { font-size: 14px; }
  .statusbar .sb-icons { display: flex; gap: 5px; letter-spacing: 1px; }
  .phone-screen { flex: 1; min-height: 0; display: flex; flex-direction: column; position: relative; }

  .app-head { flex: none; display: flex; align-items: center; gap: 12px; padding: 8px 20px 10px; }
  .app-head .mini-logo { width: 38px; height: 38px; border-radius: 12px; background: var(--grad); display: flex; align-items: center; justify-content: center; font-size: 20px; flex: none; box-shadow: 0 4px 12px rgba(255,107,157,.3); }
  .app-head .ah-title { flex: 1; min-width: 0; }
  .app-head .ah-t { font-size: 16px; font-weight: 800; letter-spacing: .3px; }
  .app-head .ah-t .hl { background: linear-gradient(90deg, var(--pink), var(--violet)); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
  .app-head .ah-s { font-size: 10.5px; color: var(--ink-soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .app-head .ah-actions { display: flex; gap: 6px; flex: none; }

  #view { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; padding: 0 16px calc(96px + env(safe-area-inset-bottom)); -webkit-overflow-scrolling: touch; }
  #view.no-pad { padding-bottom: calc(88px + env(safe-area-inset-bottom)); }

  /* ============ Bottom nav ============ */
  .bottom-nav {
    flex: none; position: absolute; left: 12px; right: 12px; bottom: calc(10px + env(safe-area-inset-bottom));
    height: 66px; background: rgba(255,255,255,.92); backdrop-filter: blur(14px);
    border-radius: 22px; box-shadow: 0 10px 30px rgba(122,95,160,.16), 0 0 0 1px rgba(122,95,160,.06);
    display: flex; align-items: stretch; padding: 6px;
  }
  .bn-item { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; cursor: pointer; color: var(--ink-faint); font-size: 10.5px; font-weight: 700; border-radius: 16px; transition: all .18s; user-select: none; }
  .bn-item .bn-ic { width: 30px; height: 30px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 19px; transition: all .18s; }
  .bn-item.active { color: var(--violet); }
  .bn-item.active .bn-ic { background: var(--grad-soft); }
  .bn-item.center .bn-ic { width: 42px; height: 42px; border-radius: 14px; background: var(--grad); font-size: 21px; box-shadow: 0 6px 16px rgba(255,107,157,.4); margin-top: -16px; }
  .bn-item.center { color: var(--pink); }

  /* ============ Generic cards / components ============ */
  .card { background: var(--surface); border-radius: var(--r-lg); box-shadow: var(--shadow-sm); overflow: hidden; }
  .sec-head { display: flex; align-items: center; gap: 8px; padding: 13px 4px; font-size: 14px; font-weight: 800; color: var(--ink); cursor: pointer; user-select: none; }
  .sec-head:hover { color: var(--violet); }
  .sec-caret { color: var(--violet); font-size: 13px; width: 12px; flex: none; }
  .sec-body { padding: 2px 4px 14px; }

  .empty-hint { text-align: center; color: var(--ink-soft); font-size: 13px; padding: 30px 10px; line-height: 1.7; }
  .empty-hint .em { font-size: 42px; display: block; margin-bottom: 10px; }
  .lbl { font-size: 11px; font-weight: 800; color: var(--violet); letter-spacing: .5px; margin: 16px 0 10px; }

  .btn-big {
    width: 100%; padding: 14px; border: none; border-radius: 16px; cursor: pointer;
    background: var(--grad); color: #fff; font-size: 15px; font-weight: 700;
    box-shadow: 0 6px 18px rgba(255,107,157,.35); transition: all .18s; animation: up .3s ease;
  }
  .btn-big:hover { transform: translateY(-2px); box-shadow: 0 10px 22px rgba(255,107,157,.45); }
  .btn-big.ghost { background: #fff; color: var(--violet); border: 1.5px solid var(--violet); box-shadow: none; }
  .btn-ghost { width: 100%; padding: 13px; border: 1.5px solid var(--violet); border-radius: 16px; cursor: pointer; background: #fff; color: var(--violet); font-size: 14px; font-weight: 700; }
  .mini-btn { padding: 8px 14px; border-radius: 999px; border: 1.5px solid var(--line-strong); background: #fff; color: var(--ink-soft); font-size: 12.5px; font-weight: 700; cursor: pointer; transition: all .15s; white-space: nowrap; }
  .mini-btn:hover { border-color: var(--violet); color: var(--violet); }
  .mini-btn.primary { background: var(--grad); color: #fff; border-color: transparent; box-shadow: 0 4px 12px rgba(255,107,157,.3); }
  .mini-btn.primary.on { background: #fff; color: var(--violet); border: 1.5px solid var(--violet); box-shadow: none; }
  .mini-btn.on { background: var(--yellow); color: #6b4b00; border-color: var(--yellow); }
  .mini-btn.danger { color: #d33; }
  .mini-btn.danger:hover { background: #ffe2e2; border-color: #f5b5b5; color: #d33; }
  .card-actions { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }

  .reset-btn { font-size: 11px; color: var(--ink-soft); background: #fff; border: 1.5px solid var(--line-strong); padding: 5px 11px; border-radius: 999px; font-weight: 600; cursor: pointer; white-space: nowrap; }
  .reset-btn:hover { border-color: var(--violet); color: var(--violet); }

  /* 状态 pill */
  .spill { display: inline-flex; align-items: center; padding: 4px 12px; border-radius: 999px; font-size: 12px; font-weight: 700; background: #f3edff; color: var(--violet); cursor: pointer; transition: all .15s; white-space: nowrap; }
  .spill.on { background: var(--grad); color: #fff; }
  .spill.mini { font-size: 11px; padding: 2px 9px; cursor: default; }
  .spill.big { font-size: 13px; padding: 8px 16px; }
  .status-pills { display: flex; gap: 7px; flex-wrap: wrap; }

  /* ============ 首页 ============ */
  .home-greet { padding: 6px 2px 12px; }
  .home-greet .hg-hi { font-size: 21px; font-weight: 800; line-height: 1.3; }
  .home-greet .hg-sub { font-size: 12.5px; color: var(--ink-soft); margin-top: 3px; }
  .search-bar { display: flex; align-items: center; gap: 9px; background: var(--surface); border-radius: 16px; padding: 12px 16px; box-shadow: var(--shadow-sm); color: var(--ink-faint); font-size: 13px; margin-bottom: 14px; }
  .search-bar .sb-x { flex: 1; }
  .pref-chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 12px; scrollbar-width: none; }
  .pref-chips::-webkit-scrollbar { display: none; }
  .pchip { flex: none; padding: 8px 14px; border-radius: 999px; border: 1.5px solid var(--line-strong); background: #fff; color: var(--ink-soft); font-size: 12px; font-weight: 700; cursor: pointer; }
  .pchip.on { background: var(--grad-soft); border-color: var(--violet); color: var(--violet); }

  .h-scroll { display: flex; gap: 12px; overflow-x: auto; padding: 2px 2px 6px; scrollbar-width: none; margin: 0 -2px; }
  .h-scroll::-webkit-scrollbar { display: none; }
  .concert-card { flex: none; width: 240px; padding: 15px; border-radius: var(--r-md); border: 1.5px solid var(--line); background: #fff; cursor: pointer; transition: all .18s; }
  .concert-card:hover { border-color: var(--violet); box-shadow: var(--shadow); }
  .concert-card .row1 { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .concert-card .art { font-size: 15px; font-weight: 800; }
  .concert-card .tag { font-size: 10.5px; padding: 3px 9px; border-radius: 999px; background: #fff0f5; color: var(--pink); font-weight: 700; }
  .concert-card .meta { font-size: 12px; color: var(--ink-soft); margin-top: 7px; line-height: 1.6; }
  .concert-card .go { margin-top: 10px; font-size: 12.5px; font-weight: 700; color: var(--violet); }

  .trip-card { padding: 14px 15px; border-radius: var(--r-md); border: 1.5px solid var(--line); margin-bottom: 10px; cursor: pointer; transition: all .18s; background: #fff; }
  .trip-card:hover { border-color: var(--pink); }
  .trip-card .t1 { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 13.5px; flex-wrap: wrap; }
  .trip-card .t2 { font-size: 12px; color: var(--ink-soft); margin-top: 5px; line-height: 1.6; }
  .trip-days { font-size: 11px; padding: 2px 9px; border-radius: 999px; background: #fff0f5; color: var(--pink); font-weight: 700; }
  .trip-x { flex: none; margin-left: auto; width: 24px; height: 24px; border-radius: 50%; border: none; background: #f3ecf7; color: var(--ink-soft); font-size: 13px; cursor: pointer; line-height: 1; }
  .trip-x:hover { background: #ffe2e2; color: #d33; }
  .plan-bar { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
  .plan-bar .bar { flex: 1; height: 7px; border-radius: 7px; background: #eee4f1; overflow: hidden; }
  .plan-bar .bar i { display: block; height: 100%; border-radius: 7px; background: linear-gradient(90deg, var(--mint), var(--sky)); }
  .plan-bar span { font-size: 11px; color: var(--ink-soft); font-weight: 700; }
  .plan-next { font-size: 11.5px; color: var(--violet); margin-top: 6px; font-weight: 700; }

  .fav-sec { margin-top: 18px; border-top: 1px solid var(--line); }
  .fav-row { display: flex; align-items: center; gap: 8px; padding: 9px 2px; border-bottom: 1px dashed var(--line); flex-wrap: wrap; }
  .fav-row:last-child { border-bottom: none; }
  .fav-main { flex: 1; min-width: 0; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; font-size: 13px; }
  .fav-btns { display: flex; gap: 6px; flex: none; }
  .my-group { display: flex; align-items: center; gap: 10px; padding: 11px 13px; border-radius: 14px; border: 1.5px solid var(--line); margin-bottom: 8px; cursor: pointer; background: #fff; transition: all .15s; }
  .my-group:hover { border-color: var(--violet); }
  .my-group .mg-ava { font-size: 20px; flex: none; }
  .my-group .mg-main { flex: 1; min-width: 0; }
  .my-group .mg-t { font-weight: 700; font-size: 13px; }
  .my-group .mg-s { font-size: 11.5px; color: var(--ink-soft); margin-top: 2px; line-height: 1.4; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .my-group .mg-x { flex: none; width: 22px; height: 22px; border-radius: 50%; border: none; background: #f3ecf7; color: var(--ink-soft); cursor: pointer; font-size: 11px; }

  /* ============ 问卷 ============ */
  .quest { width: 100%; padding: 8px 2px; }
  .quest h2 { font-size: 20px; margin-bottom: 4px; }
  .quest .sub { color: var(--ink-soft); font-size: 13px; margin-bottom: 20px; line-height: 1.6; }
  .q-step { margin-bottom: 18px; }
  .q-lab { font-size: 14px; font-weight: 800; margin-bottom: 10px; }
  .q-lab small { color: var(--ink-soft); font-weight: 600; font-size: 11px; margin-left: 4px; }
  .opt-grid { display: flex; flex-wrap: wrap; gap: 9px; }
  .opt-card { padding: 10px 16px; border-radius: 14px; border: 1.5px solid var(--line); background: #faf6fc; cursor: pointer; font-size: 14px; font-weight: 600; color: var(--ink-soft); transition: all .18s; }
  .opt-card:hover { border-color: var(--violet); }
  .opt-card.on { background: var(--grad); color: #fff; border-color: transparent; box-shadow: 0 4px 12px rgba(255,107,157,.35); }
  .quest .foot { display: flex; align-items: center; gap: 14px; margin-top: 8px; }
  .quest .prog { flex: 1; height: 8px; background: #f2e9f4; border-radius: 8px; overflow: hidden; }
  .quest .prog i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--mint), var(--sky)); border-radius: 8px; transition: width .4s ease; }
  .quest .btn-big { width: auto; padding: 12px 28px; }

  /* ============ 详情页 ============ */
  .detail-hero { border-radius: var(--r-lg); padding: 20px; color: #fff; background: var(--grad); box-shadow: 0 12px 30px rgba(255,107,157,.3); position: relative; overflow: hidden; }
  .detail-hero::after { content:''; position:absolute; right:-30px; top:-30px; width:140px; height:140px; border-radius:50%; background:rgba(255,255,255,.12); }
  .detail-hero .dh-emoji { font-size: 34px; }
  .detail-hero .dh-title { font-size: 20px; font-weight: 800; line-height: 1.3; margin-top: 6px; }
  .detail-hero .dh-tour { font-size: 13px; font-weight: 700; opacity: .95; margin-top: 2px; }
  .detail-hero .dh-meta { font-size: 12.5px; opacity: .92; margin-top: 8px; line-height: 1.6; }
  .detail-hero .dh-actions { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; position: relative; z-index: 1; }
  .dh-btn { padding: 9px 15px; border-radius: 999px; border: none; background: rgba(255,255,255,.95); color: var(--violet); font-size: 12.5px; font-weight: 800; cursor: pointer; box-shadow: 0 4px 12px rgba(0,0,0,.12); }
  .dh-btn.ghost { background: rgba(255,255,255,.2); color: #fff; border: 1.5px solid rgba(255,255,255,.6); }

  .detail-tabs { display: flex; gap: 8px; margin: 14px 0 12px; overflow-x: auto; scrollbar-width: none; padding: 1px; }
  .detail-tabs::-webkit-scrollbar { display: none; }
  .dtab { flex: none; padding: 9px 15px; border-radius: 999px; border: 1.5px solid var(--line-strong); background: #fff; color: var(--ink-soft); font-size: 12.5px; font-weight: 700; cursor: pointer; transition: all .18s; }
  .dtab.on { background: var(--grad); color: #fff; border-color: transparent; box-shadow: 0 4px 12px rgba(255,107,157,.3); }
  .back-bar { display: flex; align-items: center; gap: 8px; padding: 6px 2px 12px; }
  .back { padding: 8px 14px; border-radius: 999px; border: 1.5px solid var(--line-strong); color: var(--ink-soft); background: #fff; font-weight: 700; cursor: pointer; font-size: 12.5px; flex: none; }
  .back-title { font-weight: 800; font-size: 16px; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* 选座 */
  .panel-head { padding: 15px 18px 12px; font-weight: 800; font-size: 15px; border-bottom: 1px solid var(--line); }
  .seat-body, .host-body { padding: 16px; }
  .pref-switch { display: flex; gap: 8px; margin-bottom: 14px; }
  .pref-btn { flex: 1; padding: 9px 4px; border-radius: 12px; border: 1.5px solid var(--line); background: #fff; cursor: pointer; font-size: 12.5px; font-weight: 700; color: var(--ink-soft); transition: all .18s; }
  .pref-btn.on { background: var(--grad); color: #fff; border-color: transparent; box-shadow: 0 4px 12px rgba(255,107,157,.35); }

  .rec-card { padding: 15px; border-radius: 16px; background: var(--grad-soft); border: 1.5px solid #f4d9ec; margin-bottom: 14px; animation: up .4s ease; }
  .rec-card.alt { background: #faf6fc; border-color: var(--line); }
  .rec-card .lbl { margin: 0 0 4px; }
  .rec-card .name { font-size: 17px; font-weight: 800; margin: 4px 0 2px; }
  .rec-card .price { font-size: 20px; font-weight: 800; color: var(--pink); }
  .rec-card .reason { font-size: 13px; color: var(--ink); line-height: 1.6; margin-top: 8px; }
  .rec-card .upg { font-size: 12px; color: var(--coral); margin-top: 8px; line-height: 1.5; }

  .tier-row { padding: 11px 12px; border-radius: 13px; margin-bottom: 8px; background: #faf6fc; border: 1.5px solid transparent; cursor: pointer; transition: all .18s; }
  .tier-row.rec { border-color: var(--pink); background: #fff5f9; }
  .tier-row.preview { border-color: var(--violet); background: #f6f1ff; }
  .tier-row .t1 { display: flex; align-items: center; gap: 8px; margin-bottom: 7px; flex-wrap: wrap; }
  .tier-row .tname { font-weight: 700; font-size: 13.5px; }
  .tier-row .tprice { margin-left: auto; font-weight: 800; color: var(--pink); font-size: 13.5px; }
  .badge { font-size: 10px; padding: 2px 8px; border-radius: 999px; background: var(--pink); color: #fff; font-weight: 800; }
  .bar-line { display: flex; align-items: center; gap: 7px; font-size: 11px; color: var(--ink-soft); margin-bottom: 3px; }
  .bar-line .bl { width: 34px; flex: none; }
  .bar-line .bar { flex: 1; height: 7px; border-radius: 7px; background: #eee4f1; overflow: hidden; }
  .bar-line .bar i { display: block; height: 100%; border-radius: 7px; }
  .bar-line .bv { width: 20px; flex: none; text-align: right; color: var(--ink); font-weight: 700; }
  .view-caption { font-size: 12.5px; color: var(--ink-soft); line-height: 1.6; margin: 10px 2px 4px; padding: 9px 12px; border-radius: 11px; background: #faf6fc; }

  .checklist { display: flex; flex-direction: column; gap: 9px; }
  .check { display: flex; align-items: flex-start; gap: 10px; padding: 12px 13px; border-radius: 13px; background: #faf6fc; cursor: pointer; transition: all .18s; }
  .check:hover { background: #f3ecf7; }
  .check input { margin-top: 2px; width: 18px; height: 18px; accent-color: var(--mint); cursor: pointer; flex: none; }
  .check .ct { font-size: 13.5px; line-height: 1.5; }
  .check .ct small { display: block; color: var(--ink-soft); font-size: 11.5px; margin-top: 1px; }
  .check.done { background: #effaf6; }
  .check.done .ct { color: var(--ink-soft); text-decoration: line-through; }

  .sec-item { display: flex; gap: 10px; padding: 10px 13px; border-radius: 12px; background: #faf6fc; margin-bottom: 7px; font-size: 12.5px; line-height: 1.5; }
  .sec-item.ok { background: #effaf6; }
  .sec-item.no { background: #fff0f0; }
  .sec-item .em { font-size: 15px; flex: none; }
  .host-sec { border-bottom: 1px solid var(--line); }

  .hotel-card { padding: 12px 13px; border-radius: 13px; border: 1.5px solid var(--line); margin-bottom: 9px; }
  .hotel-card .n { font-weight: 700; font-size: 13.5px; }
  .hotel-card .d { font-size: 12px; color: var(--ink-soft); margin-top: 4px; line-height: 1.5; }
  .hotel-group { padding: 12px 13px; border-radius: 14px; border: 1.5px solid var(--line); margin-bottom: 10px; background: #fff; }
  .hg-head { display: flex; align-items: center; gap: 6px; font-size: 13.5px; }
  .hg-head .em { font-size: 18px; }
  .hg-head .cnt { margin-left: auto; font-size: 11px; font-weight: 800; color: var(--pink); background: #fff0f5; padding: 2px 9px; border-radius: 999px; }
  .hg-sub { font-size: 12px; color: var(--ink-soft); margin-top: 4px; line-height: 1.5; }

  .mem-card .mc-note { font-size: 12px; color: var(--ink-soft); margin-top: 9px; line-height: 1.6; font-style: italic; }
  .mem-card .mc-chev { flex: none; color: #d9c9ec; font-size: 18px; font-weight: 800; }

  .artist-mem { padding: 15px; border-radius: 16px; background: #fff; border: 1.5px solid var(--line); margin-bottom: 12px; }
  .artist-mem .am-top { display: flex; align-items: center; gap: 10px; }
  .artist-mem .am-ava { width: 44px; height: 44px; border-radius: 50%; flex: none; display: flex; align-items: center; justify-content: center; font-size: 22px; background: var(--grad-soft); }
  .artist-mem .am-name { font-weight: 800; font-size: 15px; }
  .artist-mem .am-sub { font-size: 11.5px; color: var(--ink-soft); margin-top: 2px; }
  .artist-mem .am-stats { display: flex; gap: 14px; margin-top: 12px; }
  .artist-mem .am-stat { flex: 1; text-align: center; }
  .artist-mem .am-stat .n { font-size: 16px; font-weight: 800; color: var(--violet); }
  .artist-mem .am-stat .l { font-size: 10.5px; color: var(--ink-soft); }

  /* 单场记忆 / scrapbook */
  .mem-detail-hero { border-radius: var(--r-xl); overflow: hidden; box-shadow: var(--shadow); position: relative; }
  .mem-detail-hero .mdh-photo { height: 180px; background: var(--grad); display: flex; align-items: center; justify-content: center; font-size: 64px; }
  .mem-detail-hero .mdh-body { padding: 18px; background: #fff; }
  .mem-detail-hero .mdh-t { font-size: 19px; font-weight: 800; }
  .mem-detail-hero .mdh-s { font-size: 12.5px; color: var(--ink-soft); margin-top: 6px; line-height: 1.6; }
  .keep-card { margin-top: 12px; padding: 14px 16px; border-radius: 16px; background: linear-gradient(135deg,#fff8e8,#fff0f5); border: 1.5px solid #ffe0c2; display: flex; align-items: center; gap: 12px; }
  .keep-card .kc-emoji { font-size: 28px; }
  .keep-card .kc-main { flex: 1; }
  .keep-card .kc-t { font-weight: 800; font-size: 13.5px; }
  .keep-card .kc-s { font-size: 11.5px; color: var(--ink-soft); margin-top: 3px; line-height: 1.5; }
  .polaroid-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 4px; }
  .polaroid { background: #fff; border-radius: 12px; border: 1px solid var(--line); padding: 8px 8px 12px; box-shadow: var(--shadow-sm); }
  .polaroid .pp-photo { height: 96px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 34px; }
  .polaroid .pp-cap { font-size: 11px; color: var(--ink-soft); margin-top: 8px; text-align: center; line-height: 1.4; }
  .polaroid.fav { border-color: var(--pink); }
  .polaroid.fav .pp-cap { color: var(--pink); }
  .moment-row { display: flex; align-items: center; gap: 10px; padding: 10px 2px; border-bottom: 1px dashed var(--line); }
  .moment-row:last-child { border-bottom: none; }
  .moment-row .mr-emoji { width: 38px; height: 38px; border-radius: 10px; background: var(--grad-soft); display: flex; align-items: center; justify-content: center; font-size: 20px; flex: none; }
  .moment-row .mr-main { flex: 1; min-width: 0; }
  .moment-row .mr-t { font-size: 13px; font-weight: 700; }
  .moment-row .mr-s { font-size: 11px; color: var(--ink-soft); margin-top: 2px; line-height: 1.4; }
  .moment-row .mr-fav { flex: none; font-size: 16px; cursor: pointer; color: var(--ink-faint); }
  .moment-row .mr-fav.on { color: var(--pink); }

  /* ============ 我的 ============ */
  .mine-head { display: flex; align-items: center; gap: 14px; padding: 8px 2px 18px; }
  .mine-avatar { width: 64px; height: 64px; border-radius: 22px; background: var(--grad); display: flex; align-items: center; justify-content: center; font-size: 32px; flex: none; box-shadow: 0 8px 20px rgba(255,107,157,.3); }
  .mine-name { font-size: 19px; font-weight: 800; }
  .mine-sub { font-size: 12px; color: var(--ink-soft); margin-top: 3px; }
  .mine-tags { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
  .mtag { font-size: 10.5px; padding: 3px 10px; border-radius: 999px; background: var(--grad-soft); color: var(--violet); font-weight: 700; }
  .mine-row { display: flex; align-items: center; gap: 12px; padding: 15px 4px; border-bottom: 1px solid var(--line); cursor: pointer; }
  .mine-row:last-child { border-bottom: none; }
  .mine-row .mr-ic { width: 38px; height: 38px; border-radius: 12px; background: var(--grad-soft); display: flex; align-items: center; justify-content: center; font-size: 18px; flex: none; }
  .mine-row .mr-t { font-weight: 700; font-size: 14px; flex: 1; }
  .mine-row .mr-v { font-size: 12.5px; color: var(--ink-faint); font-weight: 600; }
  .mine-row .mr-chev { color: #d9c9ec; font-size: 18px; font-weight: 800; }
  .mine-sec { background: var(--surface); border-radius: var(--r-lg); box-shadow: var(--shadow-sm); padding: 6px 16px; margin-bottom: 14px; }
  .mine-sec-t { font-size: 12px; font-weight: 800; color: var(--ink-soft); padding: 12px 4px 2px; }

  /* ============ Overlay / Modal / Bottom Sheet / Drawer ============ */
  .overlay { position: absolute; inset: 0; background: rgba(42,36,56,.38); backdrop-filter: blur(3px); z-index: 300; display: flex; align-items: center; justify-content: center; animation: fade .2s ease; }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  .modal { width: min(420px, 92vw); background: #fff; border-radius: 24px; box-shadow: 0 24px 60px rgba(58,46,69,.28); padding: 24px 24px 20px; animation: popup .28s ease; max-height: 88vh; overflow-y: auto; }
  @keyframes popup { from { transform: translateY(14px) scale(.96); opacity: 0; } to { transform: none; opacity: 1; } }
  .modal h3 { font-size: 18px; margin-bottom: 4px; }
  .modal .msub { color: var(--ink-soft); font-size: 13px; margin-bottom: 18px; line-height: 1.6; }
  .modal-lab { font-size: 12px; font-weight: 800; color: var(--ink-soft); margin-bottom: 10px; }
  .modal-cta { display: flex; flex-direction: column; gap: 10px; margin-top: 20px; }
  .guide-steps { display: flex; flex-direction: column; gap: 11px; margin: 4px 0 2px; }
  .guide-steps .gs { display: flex; align-items: flex-start; gap: 11px; font-size: 13.5px; line-height: 1.55; color: var(--ink); }
  .guide-steps .gn { flex: none; width: 22px; height: 22px; border-radius: 50%; background: var(--grad); color: #fff; font-size: 12px; font-weight: 800; display: flex; align-items: center; justify-content: center; margin-top: 1px; }
  .guide-steps .gs b { color: var(--violet); }

  .sheet-overlay { position: absolute; inset: 0; background: rgba(42,36,56,.38); z-index: 300; display: flex; align-items: flex-end; justify-content: center; animation: fade .2s ease; }
  .sheet { width: 100%; max-width: 460px; background: #fff; border-radius: 26px 26px 0 0; box-shadow: 0 -12px 40px rgba(58,46,69,.22); animation: sheetup .3s cubic-bezier(.2,.8,.2,1); max-height: 88vh; display: flex; flex-direction: column; }
  @keyframes sheetup { from { transform: translateY(100%); } to { transform: translateY(0); } }
  .sheet-grip { width: 40px; height: 4px; border-radius: 2px; background: #e4dced; margin: 10px auto 4px; flex: none; }
  .sheet-head { padding: 8px 22px 12px; display: flex; align-items: center; gap: 10px; font-size: 16px; font-weight: 800; flex: none; }
  .sheet-body { flex: 1; overflow-y: auto; padding: 4px 22px calc(20px + env(safe-area-inset-bottom)); }
  .sheet-x { margin-left: auto; width: 30px; height: 30px; border-radius: 50%; border: none; background: #f3ecf7; color: var(--ink-soft); font-size: 14px; cursor: pointer; }

  .field { margin-bottom: 12px; }
  .field label { font-size: 11px; font-weight: 800; color: var(--ink-soft); display: block; margin-bottom: 5px; }
  .field input, .field select, .field textarea { width: 100%; padding: 11px 13px; border-radius: 12px; border: 1.5px solid var(--line); font-size: 13.5px; outline: none; background: #fff; color: var(--ink); font-family: inherit; }
  .field input:focus, .field select:focus, .field textarea:focus { border-color: var(--violet); }
  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

  .toast {
    position: absolute; top: 18px; left: 50%; transform: translateX(-50%);
    background: var(--grad); color: #fff; padding: 12px 20px; border-radius: 999px; font-weight: 700; font-size: 13.5px;
    box-shadow: 0 8px 24px rgba(255,107,157,.4); z-index: 500; cursor: pointer; animation: up .3s ease; max-width: 90%; text-align: center; white-space: nowrap;
  }

  /* ============ 小星 loading ============ */
  .typing { display: inline-flex; gap: 3px; padding: 6px 2px; }
  .typing i { width: 6px; height: 6px; border-radius: 50%; background: var(--violet-soft); animation: blink 1.2s infinite; }
  .typing i:nth-child(2) { animation-delay: .2s; }
  .typing i:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%,80%,100% { opacity: .3; } 40% { opacity: 1; } }
  .loading-bar { display: flex; flex-direction: column; gap: 6px; padding: 10px 0; }
  .loading-bar .lb { height: 10px; border-radius: 6px; background: #f0eaf5; width: 100%; animation: shimmer 1.4s infinite; }
  .loading-bar .lb.w2 { width: 72%; }
  .loading-bar .lb.w3 { width: 48%; }
  @keyframes shimmer { 0% { opacity: .5; } 50% { opacity: 1; } 100% { opacity: .5; } }

  /* 弹层在手机 viewport 内的定位（覆盖全屏，但居中在 phone 上） */
  .overlay, .sheet-overlay { }

  @media (max-width: 520px) {
    .stage { gap: 0; padding: 0; }
    .brand-panel { display: none; }
    .phone { width: 100vw; height: 100vh; max-width: 100vw; border-radius: 0; box-shadow: none; }
    .statusbar { padding-top: env(safe-area-inset-top); }
  }

  /* ============ 计划 / D-Day 布局补充 ============ */
  .plan-body { display: flex; flex-direction: column; gap: 12px; }
  .timeline, .context { padding: 14px 16px; }
  .context { background: var(--surface); }
  .dday-cols { display: grid; grid-template-columns: 1fr; gap: 12px; }
  .journey, .map { padding: 14px 16px; }

  /* ============ Drawer + Agent chat ============ */
  .drawer-overlay { position: absolute; inset: 0; background: rgba(42,36,56,.36); z-index: 300; display: flex; justify-content: flex-end; animation: fade .2s ease; }
  .drawer { width: min(380px, 92vw); height: 100%; background: #fff; box-shadow: -18px 0 50px rgba(58,46,69,.22); display: flex; flex-direction: column; animation: sheetup .28s ease; }
  .drawer-head { padding: 16px 18px 12px; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid var(--line); font-size: 15px; font-weight: 800; }
  .drawer-body { flex: 1; overflow-y: auto; padding: 16px 18px; }
  .drawer-x { margin-left: auto; width: 30px; height: 30px; border-radius: 50%; border: none; background: #f3ecf7; color: var(--ink-soft); font-size: 14px; cursor: pointer; }
  .agent-chat { display: flex; flex-direction: column; gap: 12px; }
  .agent-msgs { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
  .abot { font-size: 13px; line-height: 1.6; padding: 11px 14px; border-radius: 14px; background: #faf6fc; border: 1px solid var(--line); border-top-left-radius: 4px; align-self: flex-start; max-width: 92%; }
  .auser { font-size: 13px; line-height: 1.5; padding: 10px 14px; border-radius: 14px; background: linear-gradient(135deg, var(--sky), var(--mint)); color: #fff; border-top-right-radius: 4px; align-self: flex-end; max-width: 88%; }
  .agent-msgs .action-row { align-self: stretch; margin-top: 2px; }
  .agent-msgs .action-row .btn-big { font-size: 13px; padding: 11px; }

  /* ============ FAB ============ */
  .fab { position: absolute; right: 22px; bottom: calc(94px + env(safe-area-inset-bottom)); width: 54px; height: 54px; border-radius: 50%; border: none; background: var(--grad); color: #fff; font-size: 22px; cursor: pointer; box-shadow: 0 10px 26px rgba(255,107,157,.45); z-index: 250; transition: all .18s; }
  .fab:hover { transform: translateY(-3px) scale(1.05); }

  /* ============ Chat ============ */
  .chat-wrap { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  #view.chat-view { display: flex; flex-direction: column; overflow: hidden; }
  .pf-head { display: flex; align-items: center; gap: 12px; margin-bottom: 6px; }
  .avatar { width: 50px; height: 50px; border-radius: 50%; flex: none; background: linear-gradient(135deg, var(--yellow), var(--coral)); display: flex; align-items: center; justify-content: center; font-size: 26px; }
  .pf-foot { font-size: 11px; color: var(--ink-soft); line-height: 1.6; }
  .pf-tag { display: flex; align-items: center; gap: 9px; padding: 10px 12px; border-radius: 14px; background: #faf4fb; border: 1.5px dashed #eadcee; color: var(--ink-soft); font-size: 13px; margin-bottom: 8px; }
  .pf-tag .em { font-size: 18px; }
  .pf-tag .lab { color: var(--ink-soft); }
  .pf-tag .val { font-weight: 700; color: var(--ink); }
  .pf-tag.filled { border-style: solid; border-color: transparent; background: linear-gradient(135deg, #fff0f5, #f0edff); }
  .pf-tag.filled .val { color: var(--pink); }

  /* ============ 首页 Carousel ============ */
  .rec-sec { position: relative; }
  .sec-head .rec-nav { margin-left: auto; display: flex; gap: 6px; flex: none; }
  .rec-arrow { width: 30px; height: 30px; border-radius: 50%; border: 1.5px solid var(--line-strong); background: #fff; color: var(--violet); font-size: 16px; font-weight: 800; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all .15s; flex: none; line-height: 1; }
  .rec-arrow:hover { background: var(--grad); color: #fff; border-color: transparent; }
  .rec-arrow:disabled { opacity: .32; cursor: default; pointer-events: none; }
  .rec-carousel { display: flex; gap: 12px; overflow-x: auto; padding: 2px 2px 8px; margin: 0 -2px; scroll-snap-type: x mandatory; scroll-behavior: smooth; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
  .rec-carousel::-webkit-scrollbar { display: none; }
  .rec-carousel .concert-card { scroll-snap-align: start; flex: 0 0 85%; width: auto; }
  .rec-dots { display: flex; gap: 5px; justify-content: center; margin: 2px 0 10px; }
  .rec-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--line-strong); transition: all .2s; cursor: pointer; }
  .rec-dot.on { width: 18px; border-radius: 6px; background: var(--grad); }

  /* ============ 星迹 · 记忆地图（Leaflet / fallback） ============ */
  .mem-map { position: relative; height: 320px; padding: 0; border-radius: var(--r-xl); overflow: hidden; box-shadow: var(--shadow-sm); background: #eef0f5; }
  .mem-map .leaflet-container { font-family: inherit; background: #eef0f5; }
  .mem-map .leaflet-tile-pane { filter: saturate(.55) contrast(.97) brightness(1.02); }
  .mem-map .mem-overlay { position: absolute; inset: 0; pointer-events: none; background: linear-gradient(160deg, rgba(255,248,235,.30), rgba(240,237,255,.22)); mix-blend-mode: soft-light; z-index: 500; }
  .mem-map .leaflet-control-attribution { font-size: 9px; opacity: .5; }
  .mem-map .leaflet-control-attribution a { color: var(--ink-soft); }
  .mem-marker { display: flex; flex-direction: column; align-items: center; gap: 4px; filter: drop-shadow(0 6px 14px rgba(122,95,160,.38)); cursor: pointer; }
  .mem-marker .mm-ring { width: 48px; height: 48px; border-radius: 50%; padding: 3px; background: linear-gradient(135deg, #a06bff, #ff6b9d); box-shadow: 0 0 0 4px rgba(255,255,255,.85); }
  .mem-marker .mm-thumb { width: 42px; height: 42px; border-radius: 50%; overflow: hidden; background: linear-gradient(135deg, #a06bff, #ff9a76); display: flex; align-items: center; justify-content: center; font-size: 21px; color: #fff; }
  .mem-marker .mm-thumb img { width: 100%; height: 100%; object-fit: cover; }
  .mem-marker .mm-label { padding: 3px 10px; border-radius: 999px; background: rgba(255,255,255,.97); color: var(--violet); font-size: 11px; font-weight: 800; box-shadow: 0 2px 8px rgba(122,95,160,.18); white-space: nowrap; }
  .mem-scrap { position: absolute; left: 14px; bottom: 14px; z-index: 510; background: #fff; border-radius: 10px; padding: 8px 8px 10px; box-shadow: var(--shadow); transform: rotate(-2deg); width: 118px; }
  .mem-scrap .ms-img { height: 78px; border-radius: 6px; background: linear-gradient(135deg, #a06bff, #ff6b9d); display: flex; align-items: center; justify-content: center; font-size: 30px; color: #fff; overflow: hidden; }
  .mem-scrap .ms-img img { width: 100%; height: 100%; object-fit: cover; }
  .mem-scrap .ms-cap { font-size: 10.5px; font-weight: 800; margin-top: 6px; text-align: center; color: var(--ink); line-height: 1.3; }
  .mem-scrap .ms-date { font-size: 9.5px; color: var(--ink-soft); text-align: center; margin-top: 2px; }
  .mem-map-caption { font-size: 10.5px; color: var(--ink-faint); text-align: center; padding: 8px 0 4px; }
  .mem-fallback-svg { width: 100%; height: 100%; display: block; }
  .mem-fallback-pin { cursor: pointer; }
  .mem-fallback-note { position: absolute; left: 0; right: 0; bottom: 8px; text-align: center; font-size: 11px; color: var(--ink-soft); pointer-events: none; z-index: 520; }

  /* 城市卡 + 记录入口 */
  .mem-city-row { display: flex; align-items: center; gap: 11px; padding: 13px 14px; border-radius: 14px; background: #fff; border: 1.5px solid var(--line); margin-bottom: 10px; cursor: pointer; transition: all .15s; }
  .mem-city-row:hover { border-color: var(--violet); }
  .mem-city-row .mcr-emoji { font-size: 22px; flex: none; }
  .mem-city-row .mcr-main { flex: 1; min-width: 0; }
  .mem-city-row .mcr-t { font-weight: 800; font-size: 14px; }
  .mem-city-row .mcr-s { font-size: 11.5px; color: var(--ink-soft); margin-top: 2px; line-height: 1.5; }
  .mem-city-row .mcr-chev { color: #d9c9ec; font-size: 18px; font-weight: 800; flex: none; }
  .record-new { display: flex; align-items: center; justify-content: center; gap: 7px; padding: 13px; border-radius: 14px; border: 1.5px dashed var(--line-strong); color: var(--violet); font-size: 13px; font-weight: 700; cursor: pointer; margin: 4px 0 14px; background: transparent; width: 100%; transition: all .15s; }
  .record-new:hover { background: var(--grad-soft); }

  /* ============ 星迹 · 单场回忆页 ============ */
  .mem-cover { border-radius: var(--r-xl); overflow: hidden; position: relative; box-shadow: var(--shadow); }
  .mem-cover .mc-img { height: 216px; background: linear-gradient(135deg,#a06bff,#ff6b9d 55%,#ff9a76); display: flex; align-items: center; justify-content: center; font-size: 66px; color: #fff; position: relative; overflow: hidden; }
  .mem-cover .mc-img img { width: 100%; height: 100%; object-fit: cover; position: absolute; inset: 0; }
  .mem-cover .mc-img::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(42,36,56,0) 52%, rgba(42,36,56,.40)); }
  .mem-cover .mc-body { padding: 16px 18px; background: #fff; }
  .mem-cover .mc-t { font-size: 19px; font-weight: 800; line-height: 1.3; }
  .mem-cover .mc-s { font-size: 12.5px; color: var(--ink-soft); margin-top: 5px; }
  .mem-cover .mc-sub { font-size: 13px; color: var(--ink); margin-top: 9px; font-style: italic; line-height: 1.6; }

  /* 星演纪念票卡 */
  .ticket-card { position: relative; margin-top: 12px; background: linear-gradient(135deg,#fffdf6,#fff0f5); border: 1.5px solid #ffe0c2; border-radius: 16px; box-shadow: var(--shadow-sm); overflow: hidden; }
  .ticket-card .tk-inner { padding: 16px 18px 30px; position: relative; }
  .ticket-perf { height: 0; border-top: 2px dashed #ead8ca; margin: 14px -18px 14px; position: relative; }
  .ticket-perf::before, .ticket-perf::after { content: ''; position: absolute; top: -13px; width: 24px; height: 24px; border-radius: 50%; background: var(--bg); border: 1.5px solid #ffe0c2; }
  .ticket-perf::before { left: -13px; } .ticket-perf::after { right: -13px; }
  .tk-brand { display: flex; align-items: center; gap: 8px; font-size: 11px; font-weight: 800; letter-spacing: .5px; color: var(--violet); }
  .tk-brand .tk-no { margin-left: auto; color: var(--ink-faint); font-weight: 700; letter-spacing: 0; }
  .tk-title { font-size: 17px; font-weight: 800; margin-top: 9px; line-height: 1.35; }
  .tk-sub { font-size: 12.5px; color: var(--ink-soft); margin-top: 3px; }
  .tk-row { display: flex; justify-content: space-between; font-size: 12.5px; margin-top: 9px; color: var(--ink); }
  .tk-row .l { color: var(--ink-soft); }
  .tk-row .v { font-weight: 700; text-align: right; }
  .tk-stamp { position: absolute; right: 16px; bottom: 16px; width: 78px; height: 78px; border: 2px solid rgba(255,107,157,.55); color: var(--pink); border-radius: 50%; display: flex; align-items: center; justify-content: center; text-align: center; font-size: 12px; font-weight: 800; transform: rotate(-14deg); opacity: .85; line-height: 1.3; }
  .tk-stamp::after { content: ''; position: absolute; inset: 4px; border: 1px dashed rgba(255,107,157,.5); border-radius: 50%; }
  .ticket-stub { display: flex; align-items: center; gap: 11px; margin-top: 14px; }
  .ticket-stub .ts-thumb { width: 56px; height: 56px; border-radius: 10px; overflow: hidden; background: #f3ecf7; flex: none; display: flex; align-items: center; justify-content: center; font-size: 24px; }
  .ticket-stub .ts-thumb img { width: 100%; height: 100%; object-fit: cover; }
  .ticket-stub .ts-main { flex: 1; font-size: 11.5px; color: var(--ink-soft); line-height: 1.5; min-width: 0; }
  .ticket-stub .ts-acts { display: flex; gap: 6px; flex: none; }

  /* ============ 星迹 · 这一程 journey + 票根 compact ============ */

/* ================= 持久化 ================= */
const LS_KEY = 'starshows_v2';
const APP_DATA_VERSION = 7; // v7：演示日期改为相对日期（开票=今天+3 / 演出=今天+30 等），开票来源「官方信息」→「演示时间」
function saveState(){
  try { localStorage.setItem(LS_KEY, JSON.stringify({ v:APP_DATA_VERSION, profile, watchlist, favorites, community, memories, albums, diaries })); } catch(e){}
}
function migrateProfile(p){
  if(!p) return p;
  if(typeof p.artist==='string'){ p.artists=[p.artist]; delete p.artist; }
  if(typeof p.city==='string'){ p.cities=[p.city]; delete p.city; }
  if(p.artists && !Array.isArray(p.artists)) p.artists=[p.artists];
  if(p.cities && !Array.isArray(p.cities)) p.cities=[p.cities];
  return p;
}
function migrateWatchlist(list){
  list.forEach(w=>{
    if(typeof w.status==='string' && !STATUS_IDS.includes(w.status)){
      if(w.status==='已有票') w.status='ticketed';
      else if(w.status==='还在考虑') w.status='considering';
      else w.status='ticketing';
    }
    if(!w.status) w.status='ticketing';
    if(!w.ticketSale) w.ticketSale = {};
    if(w.ticketSale && w.ticketSale.source==='official') w.ticketSale.source='demo'; // 旧「官方信息」→「演示时间」
    if(w.plan && !Array.isArray(w.plan.returnJourney)){
      const c = CONCERTS.find(c=>c.id===w.id);
      if(c){
        const old = w.plan;
        const fresh = buildPlan(c, w);
        if(Array.isArray(old.tasks)){
          const doneByKey = {};
          old.tasks.forEach(t=>{ doneByKey[t.key] = !!t.done; });
          fresh.tasks.forEach(t=>{ if(doneByKey[t.key] != null) t.done = doneByKey[t.key]; });
        }
        w.plan = fresh;
      }
    }
  });
  return list;
}
function migrateMemories(arr){
  if(!Array.isArray(arr) || !arr.length) return seedMemories();
  // 旧 schema（占位 3 场：周杰伦/上海、TF家族/重庆、五月天/北京）→ 替换为青岛 demo
  const isOld = arr.some(m => (m.heroTitle !== undefined && m.title === undefined));
  if(isOld) return seedMemories();
  // 补齐新字段（媒体、票根、时间等）
  arr.forEach(m=>{
    if(!m.moments) m.moments = [];
    if(m.title === undefined) m.title = m.tour || '';
    if(m.dateISO === undefined) m.dateISO = (m.date||'').match(/\d{4}\.\d{2}\.\d{2}/)?.[0]?.replace(/\./g,'-') || '';
    if(m.time === undefined) m.time = '';
    if(m.ticket === undefined) m.ticket = (m.seat||'').replace(/^.*¥/,'¥') || '';
    if(m.cover === undefined) m.cover = null;
    if(m.ticketStub === undefined) m.ticketStub = null;
    m.moments.forEach(mm=>{
      if(mm.src === undefined) mm.src = null;
      if(mm.dur === undefined) mm.dur = null;
    });
  });
  return arr;
}
function loadState(){
  try {
    const raw = localStorage.getItem(LS_KEY);
    if(!raw) return false;
    const d = JSON.parse(raw);
    if(d.v !== APP_DATA_VERSION){ try{ localStorage.removeItem(LS_KEY); }catch(e){} return false; } // 版本不符 → 清掉旧数据，重新 seed，避免 stale 数据造成「没保存/时间戳不对」
    if(d.profile) profile = migrateProfile(d.profile);
    if(profile) state.prefLabel = profile.pref;
    if(d.watchlist) watchlist = migrateWatchlist(d.watchlist);
    if(d.favorites) favorites = d.favorites;
    if(d.community) community = d.community;
    memories = migrateMemories(d.memories);
    albums = (Array.isArray(d.albums) && d.albums.length) ? d.albums : seedAlbums();
    diaries = (Array.isArray(d.diaries) && d.diaries.length) ? d.diaries : seedDiaries();
    saveState();
    return true;
  } catch(e){ return false; }
}

/* 中国时区（UTC+8，无夏令时）的「现在」——让 Demo 的今天 / 相对日期 / 倒计时在任意地区打开都一致 */
function chinaParts(){
  const d = new Date(Date.now() + 8*3600*1000);
  return { y:d.getUTCFullYear(), mo:d.getUTCMonth()+1, da:d.getUTCDate(), wd:d.getUTCDay(), h:d.getUTCHours(), mi:d.getUTCMinutes() };
}
function daysUntil(dateStr){
  const m = dateStr.match(/(\d{4})\.(\d{2})\.(\d{2})/);
  if(!m) return null;
  const t = chinaParts();
  const target = Date.UTC(+m[1], +m[2]-1, +m[3]);
  const today = Date.UTC(t.y, t.mo-1, t.da);
  return Math.round((target - today)/86400000);
}
function isWeekend(dateStr){ return /(周六|周日)/.test(dateStr); }
function daysLabel(d){
  if(d===null) return '';
  if(d<0) return '已结束';
  if(d===0) return '就是今天 🎉';
  return d+' 天后';
}
function dLabel(d){
  if(d===null) return '';
  if(d<0) return '已结束';
  if(d===0) return 'D-Day';
  return 'D-'+d;
}
function yearOf(dateStr){ const m=dateStr.match(/(\d{4})/); return m?+m[1]:null; }

/* 相对日期：Demo 数据按「今天 + N 天」动态生成，不写死年月日（以中国时区为基准） */
function demoDate(daysFromNow, time){
  const t = chinaParts();
  const d = new Date(Date.UTC(t.y, t.mo-1, t.da + daysFromNow));
  const p = n => String(n).padStart(2,'0');
  const wd = ['周日','周一','周二','周三','周四','周五','周六'][d.getUTCDay()];
  return `${d.getUTCFullYear()}.${p(d.getUTCMonth()+1)}.${p(d.getUTCDate())} ${wd} ${time}`;
}
function demoDateTime(daysFromNow, time){
  const t = chinaParts();
  const d = new Date(Date.UTC(t.y, t.mo-1, t.da + daysFromNow));
  const p = n => String(n).padStart(2,'0');
  return `${d.getUTCFullYear()}.${p(d.getUTCMonth()+1)}.${p(d.getUTCDate())} ${time}`;
}
/* 每次打开/跨天后按当天重算：只覆盖系统生成的演示日期（CONCERTS 的 date/onSale + source==='demo' 的开票时间），
   用户手动编辑（source==='user'）与「暂未公布」（source==='unknown'）的时间一律保留 */
function applyDemoDates(){
  CONCERTS.forEach(c=>{
    if(c.daysAway != null && c.time) c.date = demoDate(c.daysAway, c.time);
    if(c.onSaleDays != null && c.onSaleTime) c.onSale = demoDateTime(c.onSaleDays, c.onSaleTime);
  });
  if(watchlist) watchlist.forEach(w=>{
    const ts = w && w.ticketSale;
    if(!ts || ts.source !== 'demo') return;
    const c = CONCERTS.find(x=>x.id===w.id);
    if(c) ts.time = c.onSale;
  });
}

const BOTTOM_TABS = [
  { id:'home',   em:'🏠', lab:'首页' },
  { id:'chat',   em:'✨', lab:'小星', center:true },
  { id:'plan',   em:'🎒', lab:'计划' },

  { id:'mine',   em:'👤', lab:'我的' },
];
function tabForView(view){
  if(view==='plan'||view==='planlist') return 'plan';
  if(view==='watchlist'||view==='favorites') return 'mine';
  if(view==='grouplist'||view==='groupchat') return 'mine';
  if(view==='detail'){
    if(state.from==='plan'||state.from==='planlist') return 'plan';
    if(state.from==='watchlist'||state.from==='favorites'||state.from==='mine') return 'mine';
    return 'home';
  }
  return view; // home / chat / memory / mine
}
function renderBottomNav(){
  const box=$('#bottomNav'); if(!box) return;
  let active = tabForView(state.view);
  box.innerHTML='';
  BOTTOM_TABS.forEach(t=>{
    const d=el('div','bn-item'+(active===t.id?' active':'')+(t.center?' center':''),
      `<span class="bn-ic">${t.em}</span>${t.lab}`);
    d.onclick=()=>switchView(t.id==='plan'?'planlist':t.id);
    box.appendChild(d);
  });
}
function profArtists(){ return (profile && Array.isArray(profile.artists)) ? profile.artists : []; }
function profCities(){ return (profile && Array.isArray(profile.cities)) ? profile.cities : []; }

function switchView(v){
  if(v==='detail' && !state.activeConcert){
    state.activeConcert = CONCERTS.find(c=>profArtists().includes(c.artist)) || CONCERTS[0];
  }
  if(v==='plan' && !state.activeConcert){
    const ap=activePlan();
    if(ap) state.activeConcert = ap.c;
  }
  if(state.view!==v){
    state.from = state.view; // 所有页面都记录来路，保证返回正确
    if(v==='detail' && !state.detailTabLocked) state.detailTab='seat';
    if(v==='plan' && !state.planStageLocked){ state.planStage='prep'; state.planNode=null; state.journeySel=null; }
  }
  state.detailTabLocked = false;
  state.planStageLocked = false;
  if(v==='memory'){ state.memDetailId=null; state.memFilterArtist=null; state.albumId=null; state.diaryId=null; }
  state.view=v;
  renderBottomNav();
  renderMain();
}

function openDetail(tab, focus){
  state.activeConcert = state.activeConcert || CONCERTS[0];
  state.detailTab = tab || 'seat';
  state.hostFocus = focus || null;
  state.detailTabLocked = true;
  switchView('detail');
}
/* 导航：跳到计划页某个阶段 +（可选）聚焦的节点 */
function openPlanStage(stage, node){
  const ap = activePlan();
  state.activeConcert = ap ? ap.c : (state.activeConcert || CONCERTS[0]);
  if(stage){ state.planStage = stage; state.planStageLocked = true; }
  if(node != null){ state.planNode = node; }
  switchView('plan');
}

const LIST_VIEWS = ['watchlist','favorites','planlist','grouplist'];
function renderMain(){
  document.querySelectorAll('.fab').forEach(f=>f.remove());
  const v=$('#view');
  // 离开列表页去详情/其它页时，记住当前滚动位置，返回时恢复
  if(LIST_VIEWS.includes(state.from) && state.view!==state.from && v){
    state.scrollPos[state.from] = v.scrollTop;
  }
  v.innerHTML='';
  v.classList.remove('no-pad');
  v.classList.remove('chat-view');
  if(state.view==='home') renderHome();
  else if(state.view==='detail') renderDetail();
  else if(state.view==='plan') renderPlan();
  else if(state.view==='memory') renderMemory();
  else if(state.view==='mine') renderMine();
  else if(state.view==='watchlist') renderWatchlistPage();
  else if(state.view==='favorites') renderFavoritesPage();
  else if(state.view==='planlist') renderPlanListPage();
  else if(state.view==='grouplist') renderGroupListPage();
  else if(state.view==='groupchat') renderGroupChat(state.activeConcert || CONCERTS[0]);
  else renderChat();
  if(LIST_VIEWS.includes(state.view)){
    requestAnimationFrame(()=>{ v.scrollTop = state.scrollPos[state.view] || 0; });
  } else {
    v.scrollTop = 0;
  }
}

function renderRecScroll(){
  const sec = el('div','rec-sec');
  const head = el('div','sec-head');
  head.innerHTML = `<span class="sec-caret" style="color:var(--pink)">✦</span> 🎫 最近适合你的演出`;
  const nav = el('div','rec-nav');
  const prev = el('button','rec-arrow','‹'); prev.setAttribute('aria-label','上一场');
  const next = el('button','rec-arrow','›'); next.setAttribute('aria-label','下一场');
  nav.appendChild(prev); nav.appendChild(next);
  head.appendChild(nav);
  sec.appendChild(head);

  const carousel = el('div','rec-carousel');
  const recs = CONCERTS.filter(c=> profArtists().includes(c.artist) || (profile && c.city===profile.home) || profCities().includes(c.city));
  const list = recs.length?recs.slice():CONCERTS.slice();
  list.sort((a,b)=>rank(b)-rank(a));
  list.forEach(c=>{
    const art = profArtists().includes(c.artist);
    const hom = profile && c.city===profile.home;
    const cit = profCities().includes(c.city) && !hom;
    const matchTag = (art&&hom)?'<span class="tag" style="background:#effaf6;color:var(--mint)">完美匹配</span>'
      : art?'<span class="tag" style="background:#fff0f5;color:var(--pink)">你追的</span>'
      : hom?'<span class="tag" style="background:#eef4ff;color:var(--sky)">同城</span>'
      : cit?'<span class="tag" style="background:#eef4ff;color:var(--sky)">想去城市</span>'
      : '';
    const card=el('div','concert-card');
    card.appendChild(el('div','row1',`<span style="font-size:20px">${c.emoji}</span><span class="art">${c.artist}</span><span class="tag">${c.tour}</span>${matchTag}`));
    card.appendChild(el('div','meta',`📍 ${c.city} · ${c.venue}<br>🗓 ${c.date}${timeTag(c)}`));
    const act=el('div','card-actions');
    const fav=el('button','mini-btn'+(isFav(c.id)?' on':''), isFav(c.id)?'★ 已收藏':'☆ 收藏');
    fav.onclick=e=>{ e.stopPropagation(); toggleFavorite(c); };
    const wt=el('button','mini-btn primary'+(inWatchlist(c.id)?' on':''), inWatchlist(c.id)?'✓ 待看中':'＋ 待看');
    wt.onclick=e=>{ e.stopPropagation(); if(inWatchlist(c.id)) openPlan(c); else addToWatchlist(c); };
    act.appendChild(fav); act.appendChild(wt);
    card.appendChild(act);
    card.appendChild(el('div','go','去选座 →'));
    card.onclick=()=>{ state.activeConcert=c; switchView('detail'); };
    carousel.appendChild(card);
  });
  sec.appendChild(carousel);

  const dots = el('div','rec-dots');
  list.forEach((_,i)=> dots.appendChild(el('span','rec-dot'+(i===0?' on':''))));
  sec.appendChild(dots);

  const step = ()=>{ const c=carousel.querySelector('.concert-card'); return (c?c.offsetWidth:300) + 12; };
  const update = ()=>{
    const w = carousel.querySelector('.concert-card')?.offsetWidth || 300;
    const idx = Math.max(0, Math.min(list.length-1, Math.round(carousel.scrollLeft/(w+12))));
    dots.querySelectorAll('.rec-dot').forEach((d,i)=> d.classList.toggle('on', i===idx));
    prev.disabled = carousel.scrollLeft <= 2;
    next.disabled = carousel.scrollLeft >= carousel.scrollWidth - carousel.clientWidth - 2;
  };
  prev.onclick = ()=> carousel.scrollBy({ left:-step(), behavior:'smooth' });
  next.onclick = ()=> carousel.scrollBy({ left: step(), behavior:'smooth' });
  dots.querySelectorAll('.rec-dot').forEach((d,i)=> d.onclick = ()=> carousel.scrollTo({ left: i*step(), behavior:'smooth' }));
  carousel.addEventListener('scroll', update, { passive:true });
  window.addEventListener('resize', update);
  setTimeout(update, 60);
  return sec;
}

function renderOnSaleStrip(){
  let items = watchlist.filter(w=>{ const c=CONCERTS.find(x=>x.id===w.id); return c && w.ticketSale; });
  const box=el('div','onsale-strip');
  if(!items.length){
    box.appendChild(el('div','empty-hint','<span class="em">🔔</span>还没有开票提醒<br>把想看的演出加入「待看」，小星帮你盯开票'));
    return box;
  }
  // 优先「可行动」：有具体时间且尚未开票排最前（近→远），已开票次之，暂未公布最后；只留最多 3 条，不堆满
  const actionable = w => { const ts=w.ticketSale||{}; if(ts.time && !countdownTo(ts.time).ended) return 0; if(ts.time) return 1; return 2; };
  items = items.slice().sort((a,b)=>{
    const ra=actionable(a), rb=actionable(b);
    if(ra!==rb) return ra-rb;
    const ta=(a.ticketSale||{}).time||'9999', tb=(b.ticketSale||{}).time||'9999';
    return ta.localeCompare(tb);
  }).slice(0,3);
  items.forEach(w=>{
    const c=CONCERTS.find(x=>x.id===w.id); if(!c) return;
    const ts=w.ticketSale||{};
    const card=el('div','onsale-card');

function togglePin(w){
  if(w.pinned){ w.pinned=false; }
  else { watchlist.forEach(x=>x.pinned=false); w.pinned=true; }
  saveState();
}
function featuredPlan(){
  const plans = watchlist.filter(w=>w.plan);
  if(!plans.length) return null;
  const pinned = plans.find(w=>w.pinned);
  if(pinned) return pinned;
  let best=null, bestDays=Infinity;
  plans.forEach(w=>{
    const c=CONCERTS.find(c=>c.id===w.id); if(!c) return;
    const d=daysUntil(c.date);
    if(d===null || d<0) return; // 已结束 / 无日期的计划不作重点
    if(d<bestDays){ bestDays=d; best=w; }
  });
  return best || plans[0];
}

          [...grid.children].forEach(c=>c.classList.remove('on'));
          oc.classList.add('on');
        }
        refreshQuestFoot();
      };
      grid.appendChild(oc);
    });
    step.appendChild(grid);
    q.appendChild(step);
  });
  const foot=el('div','foot');
  foot.appendChild(el('div','prog','<i id="qProg"></i>'));
  const b=el('button','btn-big', state.editing?'保存修改 ✨':'生成我的推荐 ✨');
  b.onclick=()=>{
    if(!profileDone()) return;
    if(state.prefLabel!==profile.pref) state.prefLabel=profile.pref;
    saveState();
    state.editing=false;
    switchView('home');
  };
  foot.appendChild(b);
  q.appendChild(foot);
  refreshQuestFoot();
  return q;
}

/* ================= 推荐 / 选座打分 ================= */
function rank(c){
  const a = profArtists().includes(c.artist) ? 3 : 0;
  const hom = (profile && c.city===profile.home) ? 2 : 0;
  const cit = profCities().includes(c.city) ? 1 : 0;
  return a+hom+cit;
}
function timeTag(c){
  if(profile.time==='周末场' && isWeekend(c.date)) return ' · <b style="color:var(--mint)">周末场 ✓</b>';
  if(profile.time==='工作日晚上' && !isWeekend(c.date)) return ' · <b style="color:var(--mint)">平日晚上 ✓</b>';
  return '';
}
function score(t, key){
  if(key==='close') return t.close*0.7 + t.view*0.2 + t.sound*0.1;
  if(key==='sound') return t.sound*0.6 + t.view*0.25 + t.close*0.15;
  return (t.view*0.35 + t.sound*0.35 + t.close*0.3) / (t.price/100);
}
function recommend(c){
  c = c || state.activeConcert || CONCERTS[0];
  const key=PREFS[state.prefLabel] || PREFS[(profile && profile.pref)] || 'value';
  const max=BUDGETS[profile ? profile.budget : '不限'];
  const tiers=c.tiers.map(tierObj);
  const within=tiers.filter(t=>t.price<=max);
  const pool=within.length?within:tiers;
  const scored=pool.map(t=>({t, s:score(t,key)})).sort((a,b)=>b.s-a.s);
  const best=scored[0].t;
  let upg=null;
  if(within.length && within.length<tiers.length){
    const above=tiers.filter(t=>t.price>max).sort((a,b)=>a.price-b.price)[0];
    if(above) upg=above;
  }
  let alt=null;
  if(scored.length>1) alt=scored[1].t;
  else if(upg) alt=upg;
  else alt=scored[0].t;
  const reason = buildReason(best, key);
  const upgrade = upg ? `想要更好一点？从「${best.name}」（¥${best.price}）加 <b>¥${upg.price - best.price}</b> 可上「${upg.name}」（¥${upg.price}）——${upg.tip}。` : '';
  return { tiers, best, alt, reason, upgrade, key };
}
function buildReason(t, key){
  const b=profile ? profile.budget : '不限';
  if(key==='close') return `在 <b>${b}</b> 内，这档离舞台最近（距离 <b>${t.close}/10</b>、视野 <b>${t.view}/10</b>）。${t.tip}。`;
  if(key==='sound') return `这档声场最均衡（音响 <b>${t.sound}/10</b>、视野 <b>${t.view}/10</b>），听得最舒服。${t.tip}。`;
  return `综合「视野 ${t.view} · 音响 ${t.sound} · 距离 ${t.close}」除以票价，性价比最高的一档。${t.tip}。`;
}

function crossSectionHTML(tiers, selectedName){

  const selKey=ZONE_OF[selectedName]||'a';
  let s='<svg viewBox="0 0 360 216" style="width:100%;height:auto;display:block;border-radius:14px;background:#fffdf8">';
  s+='<line x1="12" y1="186" x2="348" y2="186" stroke="#e7dded" stroke-width="2"/>';

  Object.keys(CROSS).forEach(k=>{
    const t=byZone[k]; if(!t) return;

    s+=`<text x="${z.x}" y="${labY}" text-anchor="middle" font-size="10" font-weight="700" fill="#5a4a6a">${z.label}</text>`;
  });

  s+=`<line x1="${a.x}" y1="${a.y}" x2="44" y2="120" stroke="${a.stroke}" stroke-width="2" stroke-dasharray="5 4" opacity="0.8"/>`;

  s+=`<circle cx="${a.x}" cy="${a.y}" r="7" fill="${a.stroke}" stroke="#fff" stroke-width="2"/>`;

  return s+'</svg>';
}

/* ================= 生成 AI 观演计划 ================= */
function weatherFor(c){ return Object.assign({}, WEATHER_MOCK, { adjustments:[{txt:'Checklist 新增「雨伞」'},{txt:'出发时间提前 15 min'},{txt:'户外拍照时间缩短 20 min'}] }); }
function agentSummary(c, tasks, days){
  const undone = tasks.filter(t=>!t.done);
  if(!undone.length) return `距演出还有 ${days} 天，行前的事都安排好啦，就等演出当天出发去见 ${c.artist}。`;
  const next = undone[0];

  return `距演出还有 ${days} 天，接下来先做这件事：「${map[next.key]||next.title}」。我会根据天气、交通和你的计划变化随时更新。`;
}
function buildJourney(c, hotel){
  const fromTitle = hotel ? '从'+hotel.name+'出发' : '从住处出发（住宿待定）';
  const fromSub = hotel ? '步行 4 min 到地铁站' : '选定酒店后自动更新出发路线';
  return [
    { t:'15:40', emoji:'🏨', title:fromTitle, sub:fromSub, poi:'hotel' },
    { t:'15:45', emoji:'🚇', title:'××地铁站', sub:'地铁 18 min', poi:'metro' },
    { t:'16:10', emoji:'🍜', title:'演出前吃饭', sub:'老上海面馆 · 距场馆 400m', poi:'noodle' },
    { t:'17:00', emoji:'📸', title:'场馆打卡 / 领周边', sub:'场馆外应援区', poi:'photo' },
    { t:'17:40', emoji:'🛂', title:'排队安检', sub:'建议轻装，减少排队', poi:'security' },
    { t:'18:30', emoji:'🎫', title:'建议入场', sub:'留出找座 + 缓冲时间', poi:'entry' },
    { t:'19:30', emoji:'🎤', title:'演出开始', sub:c.artist+' · '+c.tour, poi:'stage' },
    { t:'22:10', emoji:'🎉', title:'预计散场', sub:'按演出 2h40min 估算', poi:'end' },
  ];
}
function buildReturnJourney(c, hotel){
  const endTitle = hotel ? '返回'+hotel.name : '返回住处';
  return [
    { t:'22:20', emoji:'🚶', title:'前往返程站点', sub:'最近地铁站拥挤，步行至 XX 站', poi:'walk' },
    { t:'23:10', emoji:'🏨', title:endTitle, sub:'建议提前订好网约车', poi:'hotel' },
  ];
}
function buildPlan(c, w){
  const rec=recommend(c);
  const wx=weatherFor(c);
  const days=daysUntil(c.date);
  const tasks=[];
  const push=(key,emoji,title,when,desc,stage)=>tasks.push({key,emoji,title,when,desc,stage,done:false});
  push('ticket','🎫','确定抢票策略','现在','首选 '+rec.best.name+' · 备选 '+rec.alt.name,'prep');
  push('hotel','🏨','住宿规划','尽快完成','确定场馆附近 / 地铁沿线 / 返程方便的酒店','prep2');
  push('transport','🚄','城际交通确认','尽快完成','根据所在地与演出城市给出交通建议','prep2');
  push('weather','🌦','天气与穿搭','D-3','演出前 3 天自动更新 · '+wx.temp+' '+wx.cond,'prep2');
  push('checklist','🎒','行前检查','D-1','整理随身物品 · 检查门票与证件','prep2');
  return {
    summary: agentSummary(c, tasks, days),
    tasks,
    journey: buildJourney(c, null),
    returnJourney: buildReturnJourney(c, null),
    weather: wx,
    hotel: null,
    noHotel: false,
    transport: null,
    pois: [],
    rec: { best: rec.best, alt: rec.alt },
  };
}

function insertPoiIntoJourney(plan, poi){
  const j=plan.journey;
  if(poi.cat==='散场夜宵'){
    const r=plan.returnJourney;
    const idx=r.findIndex(s=>s.poi==='walk');
    r.splice(idx+1,0,{t:'22:40',emoji:poi.emoji,title:poi.name,sub:poi.dist+' · '+poi.hours,poi:poi.id});
    r[r.length-1].t='00:10';
  } else if(poi.cat==='交通'||poi.cat==='上车点'){
    const r=plan.returnJourney;
    const idx=r.findIndex(s=>s.poi==='walk');
    r.splice(idx,0,{t:'22:25',emoji:poi.emoji,title:poi.name,sub:poi.dist+' · '+poi.hours,poi:poi.id});
  } else if(poi.cat==='寄存'){
    const idx=j.findIndex(s=>s.poi==='security');
    j.splice(idx,0,{t:'17:35',emoji:poi.emoji,title:poi.name,sub:poi.dist+' · '+poi.hours,poi:poi.id});
  } else if(poi.cat==='吃饭'){
    const idx=j.findIndex(s=>s.poi==='metro');
    j.splice(idx+1,0,{t:'16:10',emoji:poi.emoji,title:poi.name,sub:poi.dist+' · '+poi.hours,poi:poi.id});
  } else {
    const idx=j.findIndex(s=>s.poi==='entry');
    j.splice(idx,0,{t:'17:20',emoji:poi.emoji,title:poi.name,sub:poi.dist+' · '+poi.hours,poi:poi.id});
  }
}
function addPoiToPlan(poi){
  const c=state.activeConcert; if(!c){ toast('先打开一场演出详情'); return; }
  const w=getWatch(c.id);
  if(!w || !w.plan){ toast('先加入待看并生成计划，才能把地点插进行程'); return; }
  if(w.plan.pois && w.plan.pois.includes(poi.id)){ toast('这个地点已经在计划里了'); return; }
  if(!w.plan.pois) w.plan.pois=[];
  w.plan.pois.push(poi.id);
  insertPoiIntoJourney(w.plan, poi);
  saveState();
  toast('📍 已加入计划：'+poi.name);
  closeOverlay();
  if(state.view==='plan') renderPlan(); else renderMain();
}
function removePoiFromPlan(poiId){
  const c=state.activeConcert; if(!c) return;
  const w=getWatch(c.id); if(!w||!w.plan) return;
  w.plan.pois = (w.plan.pois||[]).filter(id=>id!==poiId);
  w.plan.journey = w.plan.journey.filter(s=>s.poi!==poiId);
  w.plan.returnJourney = w.plan.returnJourney.filter(s=>s.poi!==poiId);
  saveState();
  if(state.view==='plan') renderPlan(); else renderMain();
  toast('已从计划移除');
}

/* ================= AI 观演计划页面 ================= */
function renderPlan(){

  const pills=STATUS.map(s=>`<span class="spill${w.status===s.id?' on':''}" data-s="${s.id}">${s.label}</span>`).join('');

    <div class="plan-hero card">
      <div class="ph-top">

        <div class="ph-right"><div class="ph-dday">${dLabel(days)}</div><div class="ph-prog"><span>${done} / ${total}</span><div class="bar"><i style="width:${pct}%"></i></div></div></div>
      </div>
      <div class="ph-mid">
        <span class="ph-status-label">状态</span>
        <div class="status-pills" id="phPills">${pills}</div>
        <div class="ph-actions">
          <button class="mini-btn" id="phDetail">查看演出详情</button>
          <button class="mini-btn" id="phPoi">🗺 场馆周边</button>
          <button class="mini-btn primary" id="phAgent">✨ 问问小星</button>
        </div>
      </div>
    </div>
    ${proactive}
    <div class="agent-sum">✨ 小星 · 「${plan.summary}」</div>
    <div class="stage-nav">${PLAN_STAGES.map(s=>`<button class="stage-btn${s.id===stage?' on':''}" data-s="${s.id}">${s.emoji} ${s.label}</button>`).join('')}</div>
    <div class="stage-desc">${stageDesc(stage)}</div>
    <div class="plan-body" id="planBody"></div>
  </div>`;
  $('#phPills').querySelectorAll('.spill').forEach(p=>p.onclick=()=>setStatus(w,p.dataset.s));
  $('#phDetail').onclick=()=>{ state.activeConcert=c; switchView('detail'); };
  $('#phPoi').onclick=()=>openVenueDrawer(c);
  $('#phAgent').onclick=()=>openAgentDrawer(c);
  $('#planBack').onclick=()=>switchView(state.from || 'planlist');
  if(rain && !rainHandled){
    const pYes=$('#prYes'), pNo=$('#prNo');
    if(pYes) pYes.onclick=()=>{ dismissProactive(plan,'rain'); applyDepartEarly(); };
    if(pNo) pNo.onclick=()=>{ dismissProactive(plan,'rain'); renderPlan(); toast('好，出发时间先不动'); };
  }
  v.querySelectorAll('.stage-btn').forEach(b=>b.onclick=()=>{ state.planStage=b.dataset.s; state.planNode=null; state.journeySel=null; renderPlan(); });
  mountRoot().querySelectorAll('.fab').forEach(f=>f.remove());

}
function renderPlanBody(ap){
  const body=$('#planBody'); if(!body) return;
  const stage=state.planStage||'prep';
  if(stage==='dday'){ renderDday(ap); return; }
  if(stage==='return'){ renderReturn(ap); return; }
  const tasks = ap.plan.tasks.filter(t=>t.stage===stage);
  body.className='plan-body';
  body.innerHTML=`<div class="card timeline" id="planTimeline"></div><aside class="card context" id="planContext"></aside>`;
  renderTimeline(ap, tasks);
  const first = tasks.find(t=>!t.done) || tasks[0];
  if(first) renderPlanContext(ap, state.planNode || first.key);
  else { const ctx=$('#planContext'); if(ctx) ctx.appendChild(el('div','empty-hint','这一阶段还没有任务')); }
}
function renderTimeline(ap, tasks){
  const box=$('#planTimeline'); if(!box) return;
  box.innerHTML='';
  if(!tasks.length){ box.appendChild(el('div','empty-hint','这一阶段还没有任务')); return; }
  tasks.forEach((t,i)=>{
    const node=el('div','tl-node'+(t.done?' done':'')+(state.planNode===t.key?' on':''));
    node.appendChild(el('div','tl-rail',`<div class="tl-dot">${t.done?'✓':'●'}</div>${i<tasks.length-1?'<div class="tl-line"></div>':''}`));
    const body=el('div','tl-body');
    const when = t.done ? '<span class="tl-when" style="background:#e7f7f1;color:var(--mint)">✓ 已完成</span>' : `<span class="tl-when">${t.when}</span>`;
    body.appendChild(el('div','tl-row',`${when}<span class="tl-title">${t.emoji} ${t.title}</span>`));
    body.appendChild(el('div','tl-desc',t.desc));
    node.appendChild(body);
    node.onclick=()=>{ state.planNode=t.key; renderPlanContext(ap, t.key); box.querySelectorAll('.tl-node').forEach((n,k)=>n.classList.toggle('on', tasks[k].key===t.key)); };
    box.appendChild(node);
  });
}
function renderPlanContext(ap, key){

  ap.plan.journey = ap.plan.journey.map((s,i)=> i===0 ? Object.assign({},s,{t:'15:25', sub:(ap.plan.hotel?'步行 4 min 到地铁站（已提前）':'提前出发')}) : s);
  saveState(); if(state.view==='plan') renderPlan(); else renderMain();
  toast('✅ 出发时间提前了 15 分钟');
}
function dismissProactive(plan, key){
  if(!plan.dismissed) plan.dismissed = [];
  if(!plan.dismissed.includes(key)) plan.dismissed.push(key);
  saveState();
}
function applyChangeHotel(){
  const ap=activePlan(); if(!ap) return;
  const nh = HOTELS.find(h=>h.id==='h2');
  ap.plan.hotel = Object.assign({}, nh, { source:'ai' }); ap.plan.noHotel=false;
  const t=ap.plan.tasks.find(t=>t.key==='hotel'); if(t) t.done=true;

function applyHotelDone(){

function applyTransport(){

  saveState(); closeOverlay(); switchView('plan');

}
function planIntent(t){
  const ap=activePlan();
  if(!ap) return null;
  if(/(抢到|买到|已经有票|有票|出票|880|票了)/.test(t)){
    return { html:'收到～ 我把状态更新为「已经有票」，抢票任务收起来，之前安排好的住宿、交通、天气、Checklist 和当天路线都还在。', actions:[{label:'确认更新',cb:()=>applyGotTicket(),primary:true},{label:'先不改',cb:()=>ack('好，先保持原状态。')}] };
  }
  if(/(不住酒店|不住宿|当天回|当天往返|不想住|这次不用住)/.test(t)){
    return { html:'好，改为当天往返：住宿任务标为完成、出发路线改成从家出发、散场后直接返程。', actions:[{label:'应用新计划',cb:applyNoHotel,primary:true},{label:'保持原计划',cb:()=>ack('好，住宿方案先保留。')}] };
  }
  if(/(换个|换一家|换.*酒店|酒店.*换|便宜.*酒店|更便宜)/.test(t)){
    const old=(ap.plan.hotel&&ap.plan.hotel.name)||'星海精选酒店';
    const nh=HOTELS.find(h=>h.id==='h2');
    return { html:`✨ 我可以这样帮你调整：<br>住宿：<b>${old}</b> → <b>${nh.name}</b><br>预计省 <b>¥240</b>，但去场馆会多 <b>6 min</b>。`, actions:[{label:'就这样调整',cb:applyChangeHotel,primary:true},{label:'先不改',cb:()=>ack('好，先不换。')}] };
  }
  if(/(订好.*酒店|订了.*酒店|已经订.*酒店|酒店.*订好|订了酒店)/.test(t)){
    return { html:'好嘞～ 住宿我帮你标为已完成。如果想记录是哪家，可以去「行前准备 → 住宿」里添加。', actions:[{label:'标记完成',cb:applyHotelDone,primary:true},{label:'先不用',cb:()=>ack('好。')}] };
  }
  if(/(坐高铁|高铁回去|高铁.*回|坐火车|火车|坐飞机|飞机回去|飞机.*回|自驾)/.test(t)){
    const rec=transportRecs(ap.c).find(x=>/高铁/.test(x.mode))||transportRecs(ap.c)[0];
    if(!rec) return null;
    return { html:`收到～ 我帮你把城际交通定为：<b>${rec.mode} ${rec.code||''}</b>（${rec.from} → ${rec.to} · ${rec.departTime} 出发）。`, actions:[{label:'确认加入计划',cb:applyTransport,primary:true},{label:'先不改',cb:()=>ack('好。')}] };
  }
  if(/(火锅|夜宵|演出结束.*吃|想吃|吃啥|晚饭|餐厅|吃个)/.test(t)){
    return { html:'找到两家营业较晚、在返程路线附近的餐厅：<br>① 川味火锅 · 距返程站 300m · 营业至 02:00<br>② 烧烤小馆 · 步行 8 min · 营业至 01:30', actions:[{label:'＋ 加入火锅',cb:applyDinner,primary:true},{label:'先不加',cb:()=>ack('好，先不加餐。')}] };
  }
  if(/(晚点|太早|早点|不想.*早|下午三点|15:3|三点|晚出发)/.test(t)){
    return { html:'可以。如果取消周边排队，你最晚 <b>16:20</b> 从酒店出发，预计 <b>18:05</b> 到达安检口，仍保留约 55 分钟缓冲。', actions:[{label:'更新计划',cb:applyLateDeparture,primary:true},{label:'保持原计划',cb:()=>ack('好，出发时间保持不变。')}] };
  }
  if(/(下雨|天气|降温|带伞|冷)/.test(t)){
    const wx=ap.plan.weather;
    return { html:`演出当天 ${wx.temp} · ${wx.cond}，降雨概率 ${wx.rain}%，晚间体感 ${wx.night}。我已经帮你：${wx.adjustments.map(a=>a.txt).join('、')}。`, actions:[{label:'去计划页看 →',cb:()=>switchView('plan'),primary:true}] };
  }
  return null;
}
function reply(t){
  const pi=planIntent(t);
  if(pi){ pushBot(pi.html); showActions(pi.actions); return; }
  const hit=CONCERTS.find(c=>t.includes(c.artist));
  if(hit){
    state.activeConcert=hit;
    pushBot(`找到啦～ ${hit.artist} 在 ${hit.city} 的 ${hit.venue}（${hit.date}）👇 要不要去挑个座位？`);
    showAction('去选座 →', ()=>switchView('detail'));
    return;
  }
  if(/(选座|座位|位置|坐哪)/.test(t)){ pushBot('好呀，走，我帮你挑个最合适的座位 👇'); showAction('去选座 →', ()=>switchView('detail')); return; }
  if(/(开票|抢票|什么时候)/.test(t)){ askOnSale(); return; }
  if(/(酒店|住宿|住哪|订房)/.test(t)){ askHotelPath(); return; }
  if(/(安检|能带|带什么|不能带)/.test(t)){ pushBot('安检这里有几样东西要注意 👇 大型灯牌和自拍杆别带哦。'); showAction('去详情看 →', ()=>openDetail('host','security')); return; }
  if(/(应援|飘带|灯牌|手幅)/.test(t)){ pushBot('应援这块有讲究 👇 颜色按官方应援色、尺寸别挡后排、散场带走。'); showAction('去详情看 →', ()=>openDetail('host','ribbon')); return; }
  if(/(计划|规划|行程|我的计划)/.test(t)){ const ap=activePlan(); if(ap){ pushBot('这是你的观演计划 👇'); showAction('打开计划 →', ()=>switchView('plan')); return; } }
  if(/(推荐|想看|有什么|看看)/.test(t)){ pushBot('这就把适合你的演出排出来 👇'); showActionPlusChips('打开推荐 →', ()=>switchView('home'), ['还有其他想看的吗'], onChatChip); return; }
  pushBot('收到啦～ 我可以帮你：找演出、选座位、查酒店、看安检、盯开票、生成并调整观演计划。你想先来哪个？✨');
  showChatChips();
}

/* ================= 复制 ================= */
function copyText(txt, btn){
  const done=()=>{ btn.textContent='已复制 ✓'; btn.style.background='var(--mint)'; setTimeout(()=>{ btn.textContent='复制'; btn.style.background=''; },1400); };
  if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(txt).then(done).catch(()=>fallback(txt,done)); }
  else fallback(txt,done);
}
function fallback(txt, done){
  const ta=document.createElement('textarea'); ta.value=txt; ta.style.position='fixed'; ta.style.opacity='0';
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); }catch(e){}
  document.body.removeChild(ta); done();
}

/* ================= 开票系统 ================= */
function countdownTo(ts){
  const m = String(ts||'').match(/(\d{4})\.(\d{2})\.(\d{2})[ ]+(\d{1,2}):(\d{2})/);
  if(!m) return { ended:false, text:'时间待定' };
  const target = Date.UTC(+m[1], +m[2]-1, +m[3], +m[4]-8, +m[5]); // 中国时间(UTC+8) → UTC 再比较
  const diff = target - Date.now();
  if(diff<=0) return { ended:true, text:'已开票' };
  const dd=Math.floor(diff/86400000);
  const hh=Math.floor(diff%86400000/3600000);
  const mm=Math.floor(diff%3600000/60000);
  if(dd>0) return { ended:false, text:`${dd}天 ${hh}小时 ${mm}分` };
  if(hh>0) return { ended:false, text:`${hh}小时 ${mm}分` };
  return { ended:false, text:`${mm}分钟` };
}

function downloadIcs(c, ts){
  const m = String(ts.time).match(/(\d{4})\.(\d{2})\.(\d{2})[ ]+(\d{1,2}):(\d{2})/);
  if(!m){ toast('开票时间格式不正确'); return; }
  const y=+m[1], mo=+m[2], d=+m[3], h=+m[4], mi=+m[5];
  const pad=n=>String(n).padStart(2,'0');
  const dt = `${y}${pad(mo)}${pad(d)}T${pad(h)}${pad(mi)}00`;
  const dtEnd = `${y}${pad(mo)}${pad(d)}T${pad(h+1)}${pad(mi)}00`;
  const ics = `BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//StarShow//CN\r\nBEGIN:VEVENT\r\nUID:${c.id}-${dt}@starshows\r\nDTSTAMP:${dt}\r\nDTSTART:${dt}\r\nDTEND:${dtEnd}\r\nSUMMARY:${c.artist} ${c.tour} 开票（${c.city}站）\r\nDESCRIPTION:星演 StarShow 提醒：${c.artist} 开票，别错过。\r\nBEGIN:VALARM\r\nTRIGGER:-PT1H\r\nACTION:DISPLAY\r\nDESCRIPTION:1小时后开票\r\nEND:VALARM\r\nBEGIN:VALARM\r\nTRIGGER:-PT10M\r\nACTION:DISPLAY\r\nDESCRIPTION:10分钟后开票\r\nEND:VALARM\r\nEND:VEVENT\r\nEND:VCALENDAR`;
  const blob=new Blob([ics], {type:'text/calendar'});

let _leafletState = 'unknown', _leafletWaiters = [];
function ensureLeaflet(cb){
  if(window.L){ cb(true); return; }
  if(_leafletState==='ok'){ cb(true); return; }
  if(_leafletState==='fail'){ cb(false); return; }
  _leafletWaiters.push(cb);
  if(_leafletState==='loading') return;
  _leafletState='loading';
  if(!document.getElementById('leaflet-css')){
    const l=document.createElement('link'); l.id='leaflet-css'; l.rel='stylesheet';
    l.href='https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css'; document.head.appendChild(l);
  }
  const s=document.createElement('script'); s.src='https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js';
  let done=false;
  const finish=ok=>{ if(done) return; done=true; _leafletState = ok?'ok':'fail'; const ws=_leafletWaiters; _leafletWaiters=[]; ws.forEach(f=>f(ok)); };
  s.onload=()=>finish(true);
  s.onerror=()=>finish(false);
  setTimeout(()=>finish(!!window.L), 5000);
  document.head.appendChild(s);
}

function buildMemoryMap(container){
  if(container._leaflet_id){ try{ container._leaflet_id=null; }catch(e){} }
  container.innerHTML='';
  const cc = memoryCityCounts();
  const visited = Object.keys(cc);
  if(!visited.length){
    container.style.height='200px';
    container.innerHTML = `<div class="m-empty-note" style="padding:70px 20px">还没有记忆，点下方「＋ 记录一次现场」开始吧 ✦</div>`;

    else buildMemoryFallback(container, cc, visited);

function buildLeafletMemoryMap(container, cc, visited){
  const g = cityGeo(visited[0]);
  const map = L.map(container, { center:[g.lat, g.lng], zoom:11, zoomControl:false, scrollWheelZoom:false });
  L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', { subdomains:'abcd', maxZoom:19, attribution:'© OpenStreetMap · © CARTO' }).addTo(map);
  container.appendChild(el('div','mem-overlay'));
  let failed=false;
  const swapFallback=()=>{ if(failed) return; failed=true; try{ map.remove(); }catch(e){} container._leaflet_id=null; buildMemoryFallback(container, cc, visited); };
  map.on('tileerror', swapFallback);
  setTimeout(()=>{ if(!container.querySelector('.leaflet-tile-loaded')) swapFallback(); }, 5000);
  visited.forEach(city=>{
    const geo = cityGeo(city);
    const evs = memories.filter(m=>m.city===city);
    const icon = L.divIcon({ className:'', html: memoryMarkerHTML(city, evs), iconSize:[100,76], iconAnchor:[50,24] });
    const mk = L.marker([geo.lat, geo.lng], { icon }).addTo(map);
    mk.on('click', ()=>openMemoryCitySheet(city));
  });
  container.appendChild(memoryScrapHTML(visited[0]));
}
function buildMemoryFallback(container, cc, visited){
  container.innerHTML='';
  const W=400, H=320;
  let s=`<svg viewBox="0 0 ${W} ${H}" class="mem-fallback-svg" preserveAspectRatio="xMidYMid slice">`;
  s+=`<defs><linearGradient id="fbg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fdfbfe"/><stop offset=".5" stop-color="#f3eef8"/><stop offset="1" stop-color="#f7f0f3"/></linearGradient></defs>`;
  s+=`<rect width="${W}" height="${H}" fill="url(#fbg)"/>`;
  s+=`<path d="M-10 90 Q60 40 130 80 T270 60 T410 90 L410 ${H} L-10 ${H} Z" fill="#efe7f4" opacity=".6"/>`;
  s+=`<path d="M-10 150 Q80 120 150 160 T300 150 T410 170 L410 ${H} L-10 ${H} Z" fill="#e9dff0" opacity=".5"/>`;
  s+=`<path d="M200 0 Q250 40 300 30 T410 50 L410 90 Q300 80 250 110 T160 100 Q100 90 60 120 L-10 90 L-10 0 Z" fill="#f4ecf6" opacity=".7"/>`;
  visited.forEach(city=>{
    const g=cityGeo(city);
    const [x,y]=geoProject(g.lat, g.lng, W, H);
    const evs = memories.filter(m=>m.city===city);
    s+=`<g class="mem-fallback-pin" data-city="${city}">
      <circle cx="${x}" cy="${y}" r="17" fill="rgba(160,107,255,.14)"/>
      <circle cx="${x}" cy="${y}" r="13" fill="#fff" stroke="#a06bff" stroke-width="2.5"/>
      <text x="${x}" y="${y+5}" text-anchor="middle" font-size="13">🎤</text>
      <text x="${x}" y="${y+29}" text-anchor="middle" font-size="12" font-weight="800" fill="#5a4a6a">${city}</text>
      <text x="${x}" y="${y+43}" text-anchor="middle" font-size="10" fill="#a06bff">✦ ×${evs.length}</text>
    </g>`;
  });
  s+=`</svg>`;
  container.innerHTML = s;
  container.appendChild(el('div','mem-fallback-note','离线示意 · 你的星迹还在这里'));
  container.appendChild(memoryScrapHTML(visited[0]));
  container.querySelectorAll('.mem-fallback-pin').forEach(g=>{ g.onclick=()=>openMemoryCitySheet(g.dataset.city); });
}

    return `<img src="${mm.src}">`;
  }
  const em = mm.type==='video' ? '🎬' : (mm.cat==='自拍'?'🤳': mm.cat==='舞台'?'🎤': mm.cat==='票根'?'🎫': mm.cat==='应援'?'💜': mm.cat==='朋友'?'👯': mm.cat==='美食'?'🍜': '📷');

function fileToDataURL(file, cb, onErr){
  if(!file) return;
  if(file.size > 8*1024*1024){ onErr && onErr('文件太大，Demo 仅支持 ≤8MB'); return; }
  const r = new FileReader();
  r.onload = ()=>cb(r.result);
  r.onerror = ()=> onErr && onErr('读取失败，请重试');
  r.readAsDataURL(file);
}
function parseMinute(t){

}
